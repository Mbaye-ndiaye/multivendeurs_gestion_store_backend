<!-- Ajout Vendeur -->
{% extends 'dashboard/base.html' %}


{% block content %}


    <div class="container">

        <h1>Ajouter un Vendeur</h1>

        <div class="card border-0">
            <div class="card-body">
                <form class="p-5" action="{% url 'add-vendeur' %}" method='POST'>
                    {% csrf_token %}
                    {% if message %}
                    <div class="alert alert-danger">
                        <ul>
                        
                            <li>{{ message }}</li>
                       
                        </ul>
                    </div>
                    {% endif %}
                    <div class="form-row">

                        <div class="col-md-4 form-group">
                            <label for="prenom">Prénom</label>
                            <input type="text" name="prenom" id="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="nom">Nom</label>
                            <input type="text" name="nom" id="nom" class="form-control" required>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="nom">Adresse</label>
                            <input type="text" name="adresse" id="adresse" class="form-control" required>
                        </div>
                    </div>
                
                    <div class="form-row">
                        <div class="col-md-4 form-group">
                            <label for="email">Email</label>
                            <input type="text" name="email" id="email" class="form-control" required>
                        </div>
                
                        <div class="col-md-4 form-group">
                            <label for="telephone">Téléphone</label>
                            <div class="input-group">
                                <div class="input-group-prepend">
                                    <span class="input-group-text">+221</span>
                                </div>
                                <input type="text" name="telephone" id="telephone" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="nom">Pays</label>
                            <input type="text" name="pays" id="pays" class="form-control" required>
                        </div>
                    </div>
                
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label for="nom_de_la_boutique">Nom de la boutique</label>
                            <input type="text" name="nom_de_la_boutique" id="nom_de_la_boutique" class="form-control" required>
                        </div>
                
                        <div class="col-md-6 form-group">
                            <label for="couleur">Couleur de la boutique</label>
                            <input type="color" name="couleur" id="couleur" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 form-group">
                            <h4>Domaine</h4>
                            <input type="text" name="domaine" id="domaine" class="form-control" required>
                        </div>
                        <!-- <div class="form-group col-md-4">
                            <h4>Avatar</h4>
                            <input type="file" name="domaine" id="domai" class="form-control" required>
                        </div> -->
                        <!-- <div class="form-group col-md-4">
                            <h4>Clé Intech</h4>
                            <input type="text" name="intech_api_key" id="intech_api_key" class="form-control">
                        </div> -->
                        
                        <div class="form-group col-md-4">
                            <h4>Services</h4>
                            <select name="service" id="service" class="form-control">
                                {% for service in services %}
                                    <option value="{{service.id}}">{{ service.nom }}</option>
                                {% endfor %}
                            </select>
                        </div>
                   </div>
                    <div class="form-row">
                        
                        
                        
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 form-group">
                            <label for="devise">Devise</label>
                            <select name="devise" id="devise">
                                <option value="XOF">XOF</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>    
                            </select>
                        </div>
                        
                        <div class="col-md-4 form-group">
                            <label for="nb_vendeur_a_ajouter">Nombre de vendeur à ajouter</label>
                            <input type="number" name="nb_vendeur_a_ajouter" id="nb_vendeur_a_ajouter" class="form-control">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label for="wave_api_secret_key">Saisir votre clé secrète Wave</label>
                            <input type="text" name="wave_api_secret_key" id="wave_api_secret_key" class="form-control">
                        </div>
                        
                        <!-- <div class="col-md-6 form-group">
                            <label for="wave_api_key">Saisir votre clé publique Wave</label>
                            <input type="text" name="wave_api_key" id="wave_api_key" class="form-control">
                        </div> -->
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label for="paygate_network">Votre endpoint paygate</label>
                            <select name="paygate_network" id="paygate_network" class="form-control" default="TMONEY">
                                <option value="TMONEY">TMONEY</option>
                                <option value="FLOOZ">FLOOZ</option>
                            </select>
                        </div>
                        <!-- <div class="col-md-6 form-group">
                            <label for="paygate_api_key">Votre clé paygate</label>
                            <input type="text" name="paygate_api_key" id="paygate_api_key" class="form-control">
                        </div> -->

                    </div>
                    
                    <div class="form-row">
                        <div class="col-md-4 form-group">
                            <label for="wave_is_set">Wave est-il configuré ?</label>
                            <select name="wave_is_set" id="wave_is_set" class="form-control" default="0">
                                <option value="0">Non</option>
                                <option value="1">Oui</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="stripe_is_set">Stripe est-il configuré ?</label>
                            <select name="stripe_is_set" id="stripe_is_set" class="form-control" default="0">
                                <option value="0">Non</option>
                                <option value="1">Oui</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="paygate_is_set">Paygate est-il configuré ?</label>
                            <select name="paygate_is_set" id="paygate_is_set" class="form-control" default="0">
                                <option value="0">Non</option>
                                <option value="1">Oui</option>
                            </select>
                        </div>
                    <div class="form-group text-center mt-4">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                    </div>
                </form>
                
            </div>
            
       
        </div>
    
    </div>

{% endblock content %}
