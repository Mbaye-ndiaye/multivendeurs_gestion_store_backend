name: CI - Qualité assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gestion_stock_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          SECRET_KEY: dummy-secret-key-for-ci
          CI: "true"
          DB_NAME: gestion_stock_db
          DB_USER: postgres
          DB_PASSWORD: 2024
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          SECRET_KEY: dummy-secret-key-for-ci
          CI: "true"
          DB_NAME: gestion_stock_db
          DB_USER: postgres
          DB_PASSWORD: postgres_ci_2024
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py test
