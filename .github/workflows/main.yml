name: Qualite assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installer les dépendances
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Run migrations
      - name: Run migrations
        env:
          SECRET_KEY: dummy-secret-key
          CI: "true"
        run: |
          python manage.py migrate

      # Run tests
      - name: Run tests
        env:
          SECRET_KEY: dummy-secret-key
          CI: "true"
        run: |
          python manage.py test
